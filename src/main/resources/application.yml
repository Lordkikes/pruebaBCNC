spring:
  application:
    name: prices-service
  datasource:
    url: jdbc:h2:mem:prices;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: always
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
